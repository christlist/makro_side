name: Oppdater makroside

on:
  schedule:
    # Hver dag ca. 06:00 norsk tid. GitHub bruker UTC, så begge tidspunkt er planlagt og port-jobben
    # under slipper bare gjennom kjøringen der klokken er 06 i Oslo (sommertid 04:07 UTC, vintertid 05:07 UTC).
    # Minuttet 07 (ikke 00) unngår køen ved hel time, som kan forsinke planlagte kjøringer.
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: makro-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manuell kjøring: kjører alltid."
            exit 0
          fi
          h=$(TZ=Europe/Oslo date +%H)
          if [ "$h" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Klokken er 06 i Oslo: kjører."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Klokken er $h i Oslo: hopper over (den andre planlagte kjøringen tar den)."
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tester (påvirker ikke oppdateringen)
        continue-on-error: true
        run: |
          python -m pytest -q
          node --test tests/js/render.test.js

      - name: Verifiser kilder
        continue-on-error: true
        run: python -m scripts.verify_sources | tee -a "$GITHUB_STEP_SUMMARY"

      # Ett steg kjører alle gruppene. En feilet kilde gir «Data mangler» i JSON, ikke en feilet jobb.
      - name: Hent data og bygg JSON
        continue-on-error: true
        run: python -m scripts.run_all

      - name: Commit oppdaterte data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Ingen endringer i data/"
          else
            git commit -m "Oppdater makrodata $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Bygg site (docs + data)
        run: python -m scripts.build_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
