name: Oppdater makroside

on:
  schedule:
    - cron: "23 5 * * 6"   # hver lørdag 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: makro-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-sentiment.txt

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40"

      - name: Cache FinBERT
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      - name: Tester (påvirker ikke oppdateringen)
        continue-on-error: true
        run: |
          python -m pytest -q
          node --test tests/js/render.test.js

      - name: Verifiser kilder
        continue-on-error: true
        run: python -m scripts.verify_sources | tee -a "$GITHUB_STEP_SUMMARY"

      # Hvert steg feiler ikke jobben. Mangler skrives som status "missing" i JSON.
      - name: Volatilitet
        continue-on-error: true
        run: python -m scripts.fetch_volatility
      - name: Kreditt, renter og råvarer
        continue-on-error: true
        run: python -m scripts.fetch_macro
      - name: Aksjer og sektorer
        continue-on-error: true
        run: python -m scripts.fetch_equities
      - name: Sektorsentiment
        continue-on-error: true
        run: python -m scripts.fetch_sentiment
      - name: Regimestatus
        continue-on-error: true
        run: python -m scripts.build_regime
      - name: Kjøringsinfo
        continue-on-error: true
        run: python -m scripts.finalize

      - name: Commit oppdaterte data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Ingen endringer i data/"
          else
            git commit -m "Oppdater makrodata $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Bygg site (docs + data)
        run: python -m scripts.build_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
