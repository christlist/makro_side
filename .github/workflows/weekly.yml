name: Oppdater makroside

on:
  schedule:
    # Mål: oppdatering hver dag kl. 06:00 norsk tid. GitHub bruker UTC og forsinker planlagte kjøringer, noen ganger
    # med timer. Derfor er flere tidspunkt planlagt (04:07 til 06:07 UTC), og port-jobben (scripts/should_run.py)
    # slipper bare gjennom første kjøring som starter etter 06:00 i Oslo og som ikke allerede er oppdatert i dag.
    # Minuttene 07 og 37 (ikke 00) unngår køen ved hel time.
    - cron: "7 4 * * *"
    - cron: "37 4 * * *"
    - cron: "7 5 * * *"
    - cron: "37 5 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/meta.json
            scripts
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 -m scripts.should_run

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: makro-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tester (påvirker ikke oppdateringen)
        continue-on-error: true
        run: |
          python -m pytest -q
          node --test tests/js/render.test.js

      - name: Verifiser kilder
        continue-on-error: true
        run: python -m scripts.verify_sources | tee -a "$GITHUB_STEP_SUMMARY"

      # Ett steg kjører alle gruppene. En feilet kilde gir «Data mangler» i JSON, ikke en feilet jobb.
      - name: Hent data og bygg JSON
        continue-on-error: true
        run: python -m scripts.run_all

      - name: Commit oppdaterte data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Ingen endringer i data/"
          else
            git commit -m "Oppdater makrodata $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Bygg site (docs + data)
        run: python -m scripts.build_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
